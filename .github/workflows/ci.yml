name: MoonFountain verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install official MoonBit toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moon-install.sh"
          echo "46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe  $RUNNER_TEMP/moon-install.sh" | sha256sum -c -
          bash "$RUNNER_TEMP/moon-install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check build tests example and CLI
        run: python3 scripts/verify.py --target ${{ matrix.target }}
